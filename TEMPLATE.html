<!DOCTYPE html>
<!-- Copy for a new product: replace {{PRODUCT}} and {{SUPPORT_EMAIL}}, drop
     into a product directory, then deploy to the site repo (see README.md).
     Keep links relative; never hardcode the domain. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{PRODUCT}} — {{PAGE TITLE}}</title>
<style>
:root {
  --bg: #f7f8fb; --surface: #ffffff; --text: #1a2233; --text-muted: #4a5568;
  --accent: #4f46e5; --border: #dfe3ec;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1320; --surface: #1a2234; --text: #e9edf5; --text-muted: #a6b0c3;
    --accent: #8b93f8; --border: #2a3348;
  }
}
body {
  margin: 0; padding: 3rem 1.25rem; background: var(--bg); color: var(--text);
  font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
}
main { max-width: 42rem; margin: 0 auto; background: var(--surface);
  border: 1px solid var(--border); border-radius: 14px; padding: 2.5rem; }
h1 { font-size: 1.6rem; margin-top: 0; }
h2 { font-size: 1.15rem; margin: 1.75rem 0 .5rem; }
a { color: var(--accent); }
p, li { color: var(--text); }
.muted { color: var(--text-muted); font-size: .9rem; }
</style>
</head>
<body>
<main>
  <h1>{{PRODUCT}} — {{PAGE TITLE}}</h1>
  <p class="muted">Last updated: YYYY-MM-DD</p>
  <!-- body -->
</main>
</body>
</html>
